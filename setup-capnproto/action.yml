name: Setup Cap'n Proto
description: >-
  Install Cap'n Proto: build it from a release tarball or a git ref (e.g. a
  fork's branch), or download prebuilt tools from a GitHub release, with
  caching keyed on what was installed and the OS.

inputs:
  version:
    description: "Cap'n Proto release to install (e.g. 1.3.0). Ignored if `repository` is set."
    required: false
    default: "1.3.0"
  repository:
    description: >-
      Git URL to build from instead of a release (e.g.
      https://github.com/you/capnproto). Needs `ref` or `release`.
    required: false
    default: ""
  ref:
    description: >-
      Branch, tag or commit SHA in `repository`. A branch or tag is resolved to
      its commit on every run, so the cache rebuilds when it moves.
    required: false
    default: ""
  release:
    description: >-
      Tag of a GitHub release in `repository` with prebuilt tools archives, to
      download instead of building. The archive for the runner is the asset
      ending `-<os>-<arch>.tar.gz` or `.zip` (os linux, macos or windows; arch
      x86_64 or aarch64, or universal), unpacked with its top directory
      stripped, so it needs `bin/capnp` and `include/`. Cached on the asset, so
      a re-uploaded (e.g. rolling) release is downloaded again.
    required: false
    default: ""
  asset:
    description: >-
      With `release`, the prefix of the asset name, when the release has more
      than one archive for the runner.
    required: false
    default: ""
  cxx:
    description: >-
      C++ compiler for a git build (e.g. g++-15 or clang++-19). By default,
      on Linux the newest installed clang++-N (installing clang if there is
      none), since the runners' default g++ can't build Cap'n Proto 2.x;
      elsewhere the system default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Decide what to build (with which compiler) or download, and the cache
    # key for it. For a git ref the key is the commit, not the ref name, so a
    # moved branch is a cache miss.
    - name: Resolve Cap'n Proto source
      id: source
      shell: bash
      env:
        CAPNP_VERSION: ${{ inputs.version }}
        CAPNP_REPOSITORY: ${{ inputs.repository }}
        CAPNP_REF: ${{ inputs.ref }}
        CAPNP_RELEASE: ${{ inputs.release }}
        CAPNP_ASSET: ${{ inputs.asset }}
        CAPNP_CXX: ${{ inputs.cxx }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ -z "$CAPNP_REPOSITORY" ]]; then
          echo "key=$CAPNP_VERSION" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -n "$CAPNP_RELEASE" ]]; then
          repo=${CAPNP_REPOSITORY#https://github.com/}
          repo=${repo%.git}
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            Windows) os=windows ;;
            *) echo "::error::setup-capnproto: unsupported OS $RUNNER_OS"; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "::error::setup-capnproto: unsupported arch $RUNNER_ARCH"; exit 1 ;;
          esac
          # Prefer the runner's arch over a universal build.
          assets=$(gh api "repos/$repo/releases/tags/$CAPNP_RELEASE" --jq '.assets[] | "\(.id) \(.name)"')
          match=""
          for a in "$arch" universal; do
            match=$(printf '%s\n' "$assets" | awk -v p="$CAPNP_ASSET" -v s="-$os-$a" '
              index($2, p) == 1 && ($2 ~ (s "\\.tar\\.gz$") || $2 ~ (s "\\.zip$"))')
            [[ -z "$match" ]] || break
          done
          if [[ -z "$match" ]]; then
            echo "::error::setup-capnproto: no ${CAPNP_ASSET:+$CAPNP_ASSET*}-$os-$arch archive in release $CAPNP_RELEASE of $repo"
            exit 1
          fi
          if [[ $(printf '%s\n' "$match" | wc -l) -gt 1 ]]; then
            echo "::error::setup-capnproto: several archives for $os-$arch in release $CAPNP_RELEASE of $repo; pick one with \`asset\`:"
            printf '%s\n' "$match"
            exit 1
          fi
          read -r id name <<< "$match"
          echo "Downloading $name from release $CAPNP_RELEASE of $repo"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "asset=$name" >> "$GITHUB_OUTPUT"
          # The asset id changes when it's re-uploaded, so a rolling release
          # is a cache miss.
          echo "key=release-$id" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -z "$CAPNP_REF" ]]; then
          echo "::error::setup-capnproto: \`repository\` needs \`ref\`"
          exit 1
        fi
        if [[ "$CAPNP_REF" =~ ^[0-9a-f]{40}$ ]]; then
          sha=$CAPNP_REF
        else
          # A branch, or a tag. For an annotated tag, ls-remote lists both the
          # tag object and (as `^{}`) the commit it points to; take the commit.
          refs=$(git ls-remote "$CAPNP_REPOSITORY" \
            "refs/heads/$CAPNP_REF" "refs/tags/$CAPNP_REF" "refs/tags/$CAPNP_REF^{}")
          sha=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
          [[ -n "$sha" ]] || sha=$(printf '%s\n' "$refs" | awk 'NR == 1 { print $1 }')
        fi
        if [[ -z "$sha" ]]; then
          echo "::error::setup-capnproto: no branch or tag '$CAPNP_REF' in $CAPNP_REPOSITORY"
          exit 1
        fi
        cxx=$CAPNP_CXX
        if [[ -z "$cxx" && "$RUNNER_OS" == Linux ]]; then
          # The runner's default g++ can't build Cap'n Proto 2.x: Ubuntu
          # 24.04's g++ 13 lacks C++23's <print>, and g++ 14 crashes on it
          # (internal compiler error). The images also ship clang (18 on
          # 24.04), which builds it, so take the newest installed.
          cxx=$(compgen -c clang++- | grep -E '^clang\+\+-[0-9]+$' \
            | sort -u -t- -k2,2n | tail -1 || true)
          if [[ -z "$cxx" ]]; then
            sudo apt-get update -q
            sudo apt-get install -q -y --no-install-recommends clang
            cxx=clang++
          fi
        fi
        echo "Building $CAPNP_REPOSITORY at $sha ($CAPNP_REF)${cxx:+ with $cxx}"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "cxx=$cxx" >> "$GITHUB_OUTPUT"
        # The compiler is part of the key, so changing it rebuilds.
        echo "key=git-$sha${cxx:+-$cxx}" >> "$GITHUB_OUTPUT"

    - name: Cache Cap'n Proto install
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/capnp-install
        key: capnp-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.key }}

    - name: Build Cap'n Proto ${{ inputs.version }} from source
      if: steps.cache.outputs.cache-hit != 'true' && inputs.repository == ''
      shell: bash
      env:
        CAPNP_VERSION: ${{ inputs.version }}
        PREFIX: ${{ runner.temp }}/capnp-install
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        cd "$work"
        curl -fsSL "https://capnproto.org/capnproto-c++-${CAPNP_VERSION}.tar.gz" | tar xz
        cd "capnproto-c++-${CAPNP_VERSION}"
        ./configure --prefix="$PREFIX" --disable-shared --enable-static
        # nproc doesn't exist on macOS runners.
        make -j"$(getconf _NPROCESSORS_ONLN)"
        make install

    # A git checkout has no generated `configure` script, so use CMake (on
    # both runner images) rather than needing autotools installed.
    - name: Download Cap'n Proto from ${{ inputs.repository }} release ${{ inputs.release }}
      if: steps.cache.outputs.cache-hit != 'true' && inputs.release != ''
      shell: bash
      env:
        CAPNP_REPO: ${{ steps.source.outputs.repo }}
        CAPNP_RELEASE: ${{ inputs.release }}
        CAPNP_ASSET: ${{ steps.source.outputs.asset }}
        GH_TOKEN: ${{ github.token }}
        PREFIX: ${{ runner.temp }}/capnp-install
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        gh release download "$CAPNP_RELEASE" -R "$CAPNP_REPO" -p "$CAPNP_ASSET" -D "$work"
        mkdir -p "$PREFIX"
        if [[ "$CAPNP_ASSET" == *.zip ]]; then
          unzip -q "$work/$CAPNP_ASSET" -d "$work/unpacked"
          cp -R "$work"/unpacked/*/. "$PREFIX"
        else
          tar xzf "$work/$CAPNP_ASSET" -C "$PREFIX" --strip-components=1
        fi

    - name: Build Cap'n Proto from ${{ inputs.repository }} ${{ inputs.ref }}
      if: steps.cache.outputs.cache-hit != 'true' && inputs.repository != '' && inputs.release == ''
      shell: bash
      env:
        CAPNP_REPOSITORY: ${{ inputs.repository }}
        CAPNP_SHA: ${{ steps.source.outputs.sha }}
        CAPNP_CXX: ${{ steps.source.outputs.cxx }}
        PREFIX: ${{ runner.temp }}/capnp-install
      run: |
        set -euo pipefail
        compiler=()
        if [[ -n "$CAPNP_CXX" ]]; then
          cxx=$CAPNP_CXX
          echo "Using C++ compiler $cxx"
          compiler=(-DCMAKE_CXX_COMPILER="$cxx")
        fi
        work=$(mktemp -d)
        cd "$work"
        git init -q src
        git -C src fetch -q --depth 1 "$CAPNP_REPOSITORY" "$CAPNP_SHA"
        git -C src checkout -q FETCH_HEAD
        cmake -S src/c++ -B build ${compiler[@]+"${compiler[@]}"} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF
        cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"
        cmake --install build

    - name: Expose capnp on PATH
      shell: bash
      run: echo "${{ runner.temp }}/capnp-install/bin" >> "$GITHUB_PATH"

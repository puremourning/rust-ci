name: Setup Cap'n Proto
description: >-
  Build and install Cap'n Proto from source, either a release tarball or a git
  ref (e.g. a fork's branch), with caching keyed on what was built and the OS.

inputs:
  version:
    description: "Cap'n Proto release to install (e.g. 1.3.0). Ignored if `repository` is set."
    required: false
    default: "1.3.0"
  repository:
    description: >-
      Git URL to build from instead of a release (e.g.
      https://github.com/you/capnproto). Needs `ref`.
    required: false
    default: ""
  ref:
    description: >-
      Branch, tag or commit SHA in `repository`. A branch or tag is resolved to
      its commit on every run, so the cache rebuilds when it moves.
    required: false
    default: ""
  cxx:
    description: >-
      C++ compiler for a git build (e.g. g++-15 or clang++-19). By default,
      on Linux the newest installed g++-N, installing g++-14 if that is older
      (Cap'n Proto 2.x needs C++23); elsewhere the system default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Decide what to build and the cache key for it. For a git ref the key is
    # the commit, not the ref name, so a moved branch is a cache miss.
    - name: Resolve Cap'n Proto source
      id: source
      shell: bash
      env:
        CAPNP_VERSION: ${{ inputs.version }}
        CAPNP_REPOSITORY: ${{ inputs.repository }}
        CAPNP_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        if [[ -z "$CAPNP_REPOSITORY" ]]; then
          echo "key=$CAPNP_VERSION" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -z "$CAPNP_REF" ]]; then
          echo "::error::setup-capnproto: \`repository\` needs \`ref\`"
          exit 1
        fi
        if [[ "$CAPNP_REF" =~ ^[0-9a-f]{40}$ ]]; then
          sha=$CAPNP_REF
        else
          # A branch, or a tag. For an annotated tag, ls-remote lists both the
          # tag object and (as `^{}`) the commit it points to; take the commit.
          refs=$(git ls-remote "$CAPNP_REPOSITORY" \
            "refs/heads/$CAPNP_REF" "refs/tags/$CAPNP_REF" "refs/tags/$CAPNP_REF^{}")
          sha=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
          [[ -n "$sha" ]] || sha=$(printf '%s\n' "$refs" | awk 'NR == 1 { print $1 }')
        fi
        if [[ -z "$sha" ]]; then
          echo "::error::setup-capnproto: no branch or tag '$CAPNP_REF' in $CAPNP_REPOSITORY"
          exit 1
        fi
        echo "Building $CAPNP_REPOSITORY at $sha ($CAPNP_REF)"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "key=git-$sha" >> "$GITHUB_OUTPUT"

    - name: Cache Cap'n Proto install
      id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/capnp-install
        key: capnp-${{ runner.os }}-${{ runner.arch }}-${{ steps.source.outputs.key }}

    - name: Build Cap'n Proto ${{ inputs.version }} from source
      if: steps.cache.outputs.cache-hit != 'true' && inputs.repository == ''
      shell: bash
      env:
        CAPNP_VERSION: ${{ inputs.version }}
        PREFIX: ${{ runner.temp }}/capnp-install
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        cd "$work"
        curl -fsSL "https://capnproto.org/capnproto-c++-${CAPNP_VERSION}.tar.gz" | tar xz
        cd "capnproto-c++-${CAPNP_VERSION}"
        ./configure --prefix="$PREFIX" --disable-shared --enable-static
        # nproc doesn't exist on macOS runners.
        make -j"$(getconf _NPROCESSORS_ONLN)"
        make install

    # A git checkout has no generated `configure` script, so use CMake (on
    # both runner images) rather than needing autotools installed.
    - name: Build Cap'n Proto from ${{ inputs.repository }} ${{ inputs.ref }}
      if: steps.cache.outputs.cache-hit != 'true' && inputs.repository != ''
      shell: bash
      env:
        CAPNP_REPOSITORY: ${{ inputs.repository }}
        CAPNP_SHA: ${{ steps.source.outputs.sha }}
        CAPNP_CXX: ${{ inputs.cxx }}
        PREFIX: ${{ runner.temp }}/capnp-install
      run: |
        set -euo pipefail
        cxx=$CAPNP_CXX
        if [[ -z "$cxx" && "$RUNNER_OS" == Linux ]]; then
          # The runner images ship several g++ versions, but the default can
          # be too old: Ubuntu 24.04's is 13, and Cap'n Proto 2.x needs C++23
          # (libstdc++'s <print> arrived in 14). Take the newest installed.
          newest() {
            compgen -c g++- | grep -E '^g\+\+-[0-9]+$' | sort -u -t- -k2,2n | tail -1
          }
          cxx=$(newest || true)
          if [[ -z "$cxx" || "${cxx#g++-}" -lt 14 ]]; then
            sudo apt-get update -q
            sudo apt-get install -q -y --no-install-recommends g++-14
            cxx=g++-14
          fi
        fi
        compiler=()
        if [[ -n "$cxx" ]]; then
          echo "Using C++ compiler $cxx"
          compiler=(-DCMAKE_CXX_COMPILER="$cxx")
        fi
        work=$(mktemp -d)
        cd "$work"
        git init -q src
        git -C src fetch -q --depth 1 "$CAPNP_REPOSITORY" "$CAPNP_SHA"
        git -C src checkout -q FETCH_HEAD
        cmake -S src/c++ -B build ${compiler[@]+"${compiler[@]}"} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF
        cmake --build build -j"$(getconf _NPROCESSORS_ONLN)"
        cmake --install build

    - name: Expose capnp on PATH
      shell: bash
      run: echo "${{ runner.temp }}/capnp-install/bin" >> "$GITHUB_PATH"

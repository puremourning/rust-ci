name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Also dry-run the release workflow on the fixture.
        type: boolean
        default: false

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # install-action doesn't know actionlint; use its official installer.
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      # Also lint the rendered template's workflows.
      - run: ./actionlint .github/workflows/*.yml tests/fixture/.github/workflows/*.yml

  # tests/fixture is a committed render of template/. Fail if they drift, the
  # same way capnprotols checks its vendored grammar.
  template-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - run: scripts/regen-fixture.sh
      - run: git diff --exit-code -- tests/fixture

  # Run the shared CI on the rendered template. This repo's own
  # .github/actions/setup builds capnp, exercising the hook and setup-capnproto.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      msrv: "1.98"
      runners: '["ubuntu-latest", "macos-latest"]'
      working-directory: tests/fixture
      miri: true

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: patch
      dry-run: true
      working-directory: tests/fixture
